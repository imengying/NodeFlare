name = "nodeflare"
main = "build/index.js"
compatibility_date = "2026-08-13"
keep_vars = true
workers_dev = true
preview_urls = false

[build]
command = "sh scripts/build-worker.sh"

[assets]
directory = "./frontend/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[d1_databases]]
binding = "DB"
# Wrangler 4.45+ provisions and binds this database when database_id is omitted.
database_name = "nodeflare"

[[ratelimits]]
name = "API_RATE_LIMITER"
namespace_id = "73120401"

  [ratelimits.simple]
  limit = 300
  period = 60

[[ratelimits]]
name = "AUTH_RATE_LIMITER"
namespace_id = "73120402"

  [ratelimits.simple]
  limit = 20
  period = 60

[[ratelimits]]
name = "AGENT_RATE_LIMITER"
namespace_id = "73120403"

  [ratelimits.simple]
  limit = 120
  period = 60

[[durable_objects.bindings]]
name = "LIVE_HUB"
class_name = "LiveHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LiveHub"]

[triggers]
crons = ["*/5 * * * *"]

[dev]
port = 8787
