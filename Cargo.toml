[package]
name = "nodeflare-worker"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "Rust/WASM server monitor for Cloudflare Workers"
repository = "https://github.com/imengying/NodeFlare"

[lib]
crate-type = ["cdylib"]

[dependencies]
base64 = "0.23"
futures-util = { version = "0.3", default-features = false }
hmac = "0.13"
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
worker = { version = "0.8", features = ["d1"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
