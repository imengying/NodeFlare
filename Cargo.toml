[package]
name = "nodeflare-worker"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "Rust/WASM server monitor for Cloudflare Workers"
repository = "https://github.com/imengying/NodeFlare"

[lib]
crate-type = ["cdylib"]

[dependencies]
base64 = "0.22"
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
worker = { version = "0.8", features = ["d1"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
