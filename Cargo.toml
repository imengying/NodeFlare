[package]
name = "cf-monitor-worker"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Rust/WASM server monitor for Cloudflare Workers"
repository = "https://github.com/imengying/CF-Monitor"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
worker = { version = "0.8", features = ["d1"] }
worker-macros = "0.8"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
